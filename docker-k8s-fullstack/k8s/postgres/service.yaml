# Headless Service (clusterIP: None) — StatefulSet-ku stable DNS kudukkum:
#   postgres.taskapp.svc.cluster.local      → pod IP
#   postgres-0.postgres.taskapp.svc.cluster.local → specific pod
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskapp
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
