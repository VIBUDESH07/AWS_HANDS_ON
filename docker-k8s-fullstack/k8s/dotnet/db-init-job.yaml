apiVersion: batch/v1
kind: Job
metadata:
  name: dotnet-db-init
  namespace: taskapp
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: dotnet-db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: db-init
          image: taskapp/dotnet-backend:1.0
          imagePullPolicy: IfNotPresent
          # Dockerfile ENTRYPOINT ["dotnet","TaskApi.dll"] — args mattum append aagum
          args: ["--init-db"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # $(VAR) = munnaadi define panna env var-a substitute pannum
            - name: ConnectionStrings__Default
              value: Host=postgres;Port=5432;Database=dotnetdb;Username=tasks;Password=$(POSTGRES_PASSWORD)
