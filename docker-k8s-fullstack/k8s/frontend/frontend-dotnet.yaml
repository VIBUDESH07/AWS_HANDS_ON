# Ore frontend image — BACKEND_URL env mattum vera. Image reuse = build once, configure per env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dotnet
  namespace: taskapp
  labels:
    app: frontend-dotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-dotnet
  template:
    metadata:
      labels:
        app: frontend-dotnet
    spec:
      containers:
        - name: nginx
          image: taskapp/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://dotnet-backend:8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-dotnet
  namespace: taskapp
spec:
  selector:
    app: frontend-dotnet
  ports:
    - name: http
      port: 80
      targetPort: http
